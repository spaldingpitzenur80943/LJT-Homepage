name: Diagnose Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Pages API response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "GET Pages"
            gh api "repos/${{ github.repository }}/pages"
            echo ""
            echo "GET latest Pages build"
            gh api "repos/${{ github.repository }}/pages/builds/latest"
          } > pages-diagnostic.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnostic.txt
          git commit -m "Record Pages status" || true
          git push