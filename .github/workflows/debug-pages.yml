name: Diagnose Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Pages API response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "GET Pages"
            gh api "repos/${{ github.repository }}/pages"
            echo "POST Pages workflow"
            gh api --method POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          } > pages-diagnostic.txt 2>&1 || true
          gh api --method PUT "repos/${{ github.repository }}/contents/pages-diagnostic.txt" \
            -f message="Record Pages setup diagnostic" \
            -f content="$(base64 -w0 pages-diagnostic.txt)" \
            -f branch=master
