name: Diagnose Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean up diagnostics and unused template assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$( {
            echo "Repository: ${{ github.repository }}"
            echo "GET Pages"
            gh api "repos/${{ github.repository }}/pages"
            echo ""
            echo "GET latest Pages build"
            gh api "repos/${{ github.repository }}/pages/builds/latest"
          } 2>&1 || true )
          echo "$status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/debug-pages.yml pages-diagnostic.txt
          git rm -f images/profile.png images/bio-photo.jpg images/bio-photo-2.jpg images/og-image.png
          git rm -rf _data/comments
          git commit -m "Remove template diagnostics and unused sample assets" -m "$status"
          git push
          git push origin --delete gh-pages